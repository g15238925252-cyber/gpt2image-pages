<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GPT2Image-Pro</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #070a12, #111827);
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(880px, calc(100vw - 32px));
        padding: 48px;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(40px, 7vw, 72px);
        line-height: 1;
      }
      p {
        color: #cbd5e1;
        font-size: 18px;
        line-height: 1.8;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 32px;
      }
      a.button {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 999px;
        background: #f8fafc;
        color: #020617;
        font-weight: 700;
        text-decoration: none;
      }
      a.secondary {
        background: rgba(255, 255, 255, 0.08);
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.18);
      }
      .notice {
        margin-top: 32px;
        padding: 18px 20px;
        border-radius: 18px;
        background: rgba(250, 204, 21, 0.1);
        border: 1px solid rgba(250, 204, 21, 0.25);
        color: #fde68a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>GPT2Image-Pro</h1>
      <p>
        这是 GPT2Image-Pro 的 GitHub Pages 展示页。项目本体是 Next.js、PostgreSQL 与 API 服务组成的全栈应用，完整图片生成、登录、积分、数据库与后台接口功能需要部署到支持后端运行的平台。
      </p>
      <div class="actions">
        <a class="button" href="https://github.com/g15238925252-cyber/gpt2image-pages">查看仓库</a>
        <a class="button secondary" href="https://github.com/MeowFree/GPT2Image-Pro">源项目</a>
      </div>
      <div class="notice">
        GitHub Pages 只能托管静态文件。本页面用于展示项目入口；完整运行建议使用 Docker、VPS、Vercel、Render、Railway、Fly.io 等支持后端与数据库的平台。
      </div>
    </main>
  </body>
</html>
